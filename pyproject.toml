[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elisity-cli"
version = "0.1.0"
description = "Elisity CCC CLI — complete command-line interface to the Elisity Cloud Control Center API"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Elisity", email = "support@elisity.com"},
]
dependencies = [
    "click==8.3.1",
    "requests==2.33.1",
    "tenacity==9.1.4",
    "rich==14.3.3",
    "pyyaml==6.0.3",
    "jmespath==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "responses==0.26.0",
]

[project.scripts]
elisity = "elisity_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit a live CCC tenant. They are skipped by default;
# run them explicitly with `pytest -m integration` after setting
# CCC_BASE_URL / CCC_CLIENT_ID / CCC_CLIENT_SECRET.
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: tests that require a live CCC tenant (skipped by default)",
]
