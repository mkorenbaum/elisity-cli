name: tests

on:
  push:
    branches: [main, compat/python-3.9]
  pull_request:
    branches: [main, compat/python-3.9]

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    # Pinned, not `ubuntu-latest`. actions/python-versions ships no 3.9 build for
    # ubuntu-24.04's successor, while 3.10-3.13 all have one. When GitHub rolls the
    # `latest` label, setup-python would fail to resolve 3.9 and the only leg that
    # proves this branch's reason for existing would die silently.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest
